# All values can be overridden with environment variables (defaults are for local development only).
server.port=${PORT:8080}
server.servlet.context-path=/api/v1.0

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/billing_app}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Frontend origin(s) allowed by CORS (comma-separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# AWS S3 (item/category image uploads)
aws.access.key=${AWS_ACCESS_KEY:your_access_key}
aws.secret.key=${AWS_SECRET_KEY:your_secret_key}
aws.region=${AWS_REGION:ap-south-1}
aws.bucket.name=${AWS_BUCKET_NAME:your_bucket_name}

# JWT signing key - use a long random string in production
jwt.secret.key=${JWT_SECRET_KEY:dev-only-change-me-use-a-long-random-string}

# Razorpay (use TEST keys)
razorpay.key.id=${RAZORPAY_KEY_ID:your_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:your_key_secret}
